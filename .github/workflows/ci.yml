name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build (server + web)
        run: npm run build

  # The tools in scripts/ judge a live estate, and each is exercised by its own
  # unit tests: `zone-notify-reconcile.py` decides whether a zone is armed to
  # notify only this server (and a deploy refuses to start into that), and
  # `vault-env.py` whether .env carries unresolved references. Those tests only
  # ran on the host before; a change to one of these judgements ships here, so
  # this is where it has to be provable.
  scripts:
    name: Script checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Unit tests for the scripts
        run: python3 -m unittest discover -s scripts/tests -t scripts/tests -v

      - name: Python syntax
        run: python3 -m py_compile scripts/*.py scripts/tests/*.py
