name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push the Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

      - name: Generate software bill of materials
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: cerulean-sbom.spdx.json

      - name: Build release artifacts
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Source tarball (excludes git, node_modules, runtime data, secrets)
          tar \
            --exclude='./.git' \
            --exclude='./.env' \
            --exclude='./node_modules' \
            --exclude='./data' \
            --exclude='*/node_modules' \
            --exclude='*/dist' \
            --exclude='*/node_modules/.cache' \
            -czf "cerulean-${TAG}.tar.gz" .
          # Standalone server + web source bundles
          (cd server && tar --exclude=node_modules --exclude=dist -czf "../cerulean-server-${TAG}.tar.gz" src tests package.json tsconfig.json vitest.config.ts)
          (cd web && tar --exclude=node_modules --exclude=dist -czf "../cerulean-web-${TAG}.tar.gz" src package.json tsconfig.json vite.config.ts index.html)
          sha256sum cerulean-*.tar.gz cerulean-sbom.spdx.json > SHA256SUMS.txt

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            cerulean-*.tar.gz
            cerulean-sbom.spdx.json
            SHA256SUMS.txt
