include:
  # Canonical NPM Edge integration: NPM + MariaDB + backup-ui.
  # Its services remain profile-gated.
  - ../npm/compose.cerulean.yml

services:
  cerulean:
    build: .
    container_name: cerulean
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    env_file: .env
    # Technitium runs on the host network (port 53/67/5380), so the app
    # reaches it via the host gateway rather than 127.0.0.1 (which would be
    # the app container itself). TECHNITIUM_URL should be
    # http://host.docker.internal:5380.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${CERULEAN_PORT:-3000}:${CERULEAN_PORT:-3000}"
    volumes:
      - ./data:/app/data
      # Scoped Vault token, minted by the vault profile into ./data/vault/token
      # (read .env's VAULT_TOKEN_FILE). Read-only, and only that directory — the
      # unseal key and root token stay in ./data/vault/init, which only the vault
      # container mounts.
      - ./data/vault/token:/vault/token:ro
    depends_on:
      cerulean-technitium:
        condition: service_healthy
        required: false
      vault:
        condition: service_healthy
        required: false

  # ── Bundled Technitium DNS Server (OPT-IN: docker compose --profile technitium up -d) ──
  # Authoritative + recursive DNS, DHCP, and ad-blocking in one container.
  # Cerulean is the master orchestrator: it drives Technitium via HTTP API
  # (/api/zones/*, /api/dhcp/*, /api/blocked/*, /api/settings/*).
  #   • Auto-creates zones from Domains + the server apex <serverId>.lab.innotel.us
  #   • ACME DNS-01 TXT records via /api/zones/records/add (replaces RFC2136/nsupdate)
  #   • DHCP scopes & leases via /api/dhcp/scopes/*
  #   • Ad-blocking via /api/settings + /api/blocked/* + block lists
  # The web console is at http://<host>:5380 (admin / TECHNITIUM_ADMIN_PASSWORD).
  # Port 53 is published so the LAN can use this host as DNS; 67/udp for DHCP.
  cerulean-technitium:
    image: technitium/dns-server:latest
    container_name: cerulean-technitium
    profiles: ["technitium"]
    restart: unless-stopped
    # Host networking: Technitium binds :53 (DNS), :67 (DHCP broadcasts), and
    # :5380 (console) directly on the host — required for DHCP to hear client
    # broadcasts. The cerulean app reaches it through the host gateway at
    # http://host.docker.internal:5380 (never 127.0.0.1 — that would be the
    # app container itself).
    # (Requires port 53 to be free on the host: scripts/setup.sh disables
    # systemd-resolved's stub listener automatically.)
    network_mode: host
    # Optional DNS-over-TLS/HTTPS extra listeners are configured in Technitium.
    # When network_mode: host is used, no port mappings are needed:
    #   TECHNITIUM_DNS_UDP_PORT / TECHNITIUM_DNS_TCP_PORT / TECHNITIUM_WEB_PORT /
    #   TECHNITIUM_DHCP_PORT are retained only for documentation.
    environment:
      DNS_SERVER_DOMAIN: ${TECHNITIUM_DOMAIN:-${CERULEAN_SERVER_ID:-cerulean}.lab.innotel.us}
      DNS_SERVER_ADMIN_PASSWORD: ${TECHNITIUM_ADMIN_PASSWORD:-${TECHNITIUM_PASSWORD:-}}
      DNS_SERVER_PREFER_IPV6: "${DNS_SERVER_PREFER_IPV6:-false}"
      DNS_SERVER_WEB_SERVICE_HTTP_PORT: "5380"
      DNS_SERVER_RECURSION: "${DNS_SERVER_RECURSION:-AllowOnlyForPrivateNetworks}"
      DNS_SERVER_ENABLE_BLOCKING: "${DNS_SERVER_ENABLE_BLOCKING:-true}"
      DNS_SERVER_BLOCK_LIST_URLS: ${DNS_SERVER_BLOCK_LIST_URLS:-}
      DNS_SERVER_FORWARDERS: ${DNS_SERVER_FORWARDERS:-1.1.1.1,8.8.8.8}
      DNS_SERVER_FORWARDER_PROTOCOL: "${DNS_SERVER_FORWARDER_PROTOCOL:-Udp}"
    volumes:
      - ./data/technitium:/etc/dns
    # The image ships no wget/curl/nc, so probe the web console over bash's
    # /dev/tcp instead of an HTTP client. GET / answers 200 once the server
    # is listening. /dev/tcp is a bash feature, so invoke bash explicitly
    # (the container's default /bin/sh is dash, which lacks it).
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/5380 && printf \"GET / HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -qi \"^HTTP/1\\.[01] 200\" <&3'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Authentik (OPT-IN: docker compose --profile authentik up -d) ────────
  authentik-server:
    mem_limit: 1500m
    memswap_limit: 1500m
    image: ghcr.io/goauthentik/server:${AUTHENTIK_IMAGE_TAG:-2026.8.2}
    container_name: cerulean-authentik
    profiles: ["authentik"]
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL_PASSWORD:-}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_REDIS__CACHE_TIMEOUT_OVERRIDES__default: "86400"
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@cerulean.innotel.us}
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - ./data/authentik/media:/media
      - ./data/authentik/custom-templates:/templates
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_IMAGE_TAG:-2026.8.2}
    container_name: cerulean-authentik-worker
    profiles: ["authentik"]
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL_PASSWORD:-}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@cerulean.innotel.us}
    volumes:
      - ./data/authentik/media:/media
      - ./data/authentik/custom-templates:/templates
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

  authentik-postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: cerulean-authentik-postgres
    profiles: ["authentik"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRESQL_PASSWORD:-}
    volumes:
      - ./data/authentik/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      interval: 5s
      timeout: 5s
      retries: 10

  authentik-redis:
    image: docker.io/library/redis:alpine
    container_name: cerulean-authentik-redis
    profiles: ["authentik"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── HashiCorp Vault (OPT-IN: docker compose --profile vault up -d) ───────
  vault:
    mem_limit: 512m
    memswap_limit: 512m
    image: hashicorp/vault:${VAULT_IMAGE_TAG:-1.17}
    container_name: cerulean-vault
    profiles: ["vault"]
    restart: unless-stopped
    # Durable, file-backed Vault (not dev mode). scripts/vault-entrypoint.sh
    # initialises+unseals the server on start, enables KV v2 at VAULT_PREFIX,
    # mints a periodic token for that prefix, and mints a narrower token for each
    # product in VAULT_PRODUCT_TOKENS — renewing them all in place. See
    # docs/vault-setup.md.
    entrypoint: ["/bin/sh", "/vault/bootstrap/entrypoint.sh"]
    environment:
      # Used by the healthcheck and by the bootstrap CLI (the server itself is
      # configured from /vault/init/vault.hcl). The app reaches it as vault:8200.
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_PREFIX: ${VAULT_PREFIX:-cerulean}
      # Products needing a token narrowed to <prefix>/data/<product> rather than
      # the mount-wide grant. Space-separated; empty = mount-wide token only.
      VAULT_PRODUCT_TOKENS: ${VAULT_PRODUCT_TOKENS:-}
    volumes:
      # Encrypted storage — the durable part; survives restarts and rebuilds.
      - ./data/vault/file:/vault/file
      # Unseal key + root token (mode 600). Operator-only: never mounted into
      # the app. Back this directory up — losing it means the store stays sealed
      # (or must be wiped, losing the mirrored secrets).
      - ./data/vault/init:/vault/init
      # The tokens clients read: cerulean.token for the mount-wide policy, plus
      # one <product>.token per name in VAULT_PRODUCT_TOKENS.
      - ./data/vault/token:/vault/token
      - ./scripts/vault-entrypoint.sh:/vault/bootstrap/entrypoint.sh:ro
    ports:
      - "8200:8200"
    healthcheck:
      # `vault status` exits 2 while sealed/uninitialised, so this only turns
      # healthy once the bootstrap has unsealed and provisioned the store.
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
